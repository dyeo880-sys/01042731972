name: 맛집 게시판 검색용 페이지 만들기

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국 시간 새벽 6시
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 게시판 글을 페이지로 만들기
        run: python3 tools/build_matjip.py
      - name: 바뀐 것이 있으면 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A matjip sitemap.xml
          git diff --cached --quiet || (git commit -m "맛집 검색용 페이지 갱신" && git push)
